{% extends "base.html" %}{% block title %}Memory Garden{% endblock %}
{% block content %}<section class="game-shell"><a class="back-link" href="/hub">← Mind Lab</a><span class="eyebrow">CALM MEMORY</span><h1>Memory Garden</h1><p>Match every pair. Fewer moves grow a stronger score.</p><div class="game-stats"><span>Moves <b id="moves">0</b></span><span>Pairs <b id="pairs">0</b>/6</span><span>Time <b id="memoryTime">0</b>s</span></div><div class="memory-grid" id="memoryGrid"></div><div id="memoryResult"></div></section>{% endblock %}
{% block scripts %}<script>
const symbols=["✦","✿","☾","◈","❋","⌁"],deck=[...symbols,...symbols].sort(()=>Math.random()-.5),grid=document.getElementById("memoryGrid");let open=[],matched=0,moves=0,locked=false,seconds=0;const timer=setInterval(()=>document.getElementById("memoryTime").textContent=++seconds,1000);
deck.forEach(symbol=>{const card=document.createElement("button");card.className="memory-card";card.textContent="◇";card.dataset.symbol=symbol;card.onclick=()=>{if(locked||open.includes(card)||card.classList.contains("matched"))return;card.textContent=symbol;card.classList.add("open");open.push(card);if(open.length===2){moves++;document.getElementById("moves").textContent=moves;locked=true;if(open[0].dataset.symbol===open[1].dataset.symbol){open.forEach(c=>c.classList.add("matched"));matched++;document.getElementById("pairs").textContent=matched;open=[];locked=false;if(matched===6){clearInterval(timer);const score=Math.max(100,1200-moves*30-seconds*3);saveGame("Memory Match",score).then(d=>document.getElementById("memoryResult").innerHTML=`<div class="panel"><h2>Garden complete ✦</h2><p>${moves} moves · ${seconds} seconds · ${score} points · ${d.xp_earned||0} XP</p><button class="btn btn-primary" onclick="location.reload()">Play again</button></div>`)}}else setTimeout(()=>{open.forEach(c=>{c.textContent="◇";c.classList.remove("open")});open=[];locked=false},700)}};grid.appendChild(card)});
</script>{% endblock %}
